name: Build and Push Docker Images

on:
  push:
    branches:
      - movie-recommender-system  # or your desired branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to GitHub Docker registry
        uses: docker/login-action@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # Use GitHub token here for authentication
          registry: ghcr.io

      - name: Build and push movie-recommender Docker image
        run: |
          docker build --file ml_backend/Dockerfile \
                      --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
                      --label "org.opencontainers.image.description=movie-recommender container for ML-techniques" \
                      -t ghcr.io/filipmojto/movie-recommender:latest ./
          docker push ghcr.io/filipmojto/movie-recommender:latest

      # - name: Build and push backend Docker image
      #   run: |
      #     docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
      #                  --label "org.opencontainers.image.description=Backend container for LLM Spot" \
      #                  -t ghcr.io/filipmojto/backend:latest ./backend
      #     docker push ghcr.io/filipmojto/backend:latest